<!-- EJEMPLO USANDO JS EXTERNO DE URL -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini Bootstrap</title>
  
  <!-- CDN de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-5">
    <h1 class="text-primary">Hola Bootstrap 👋</h1>
    <p class="lead">Este es un ejemplo sencillo usando CDN</p>
    
    <button class="btn btn-success">Botón verde</button>
    <button class="btn btn-danger">Botón rojo</button>
  </div>

  <!-- JS de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
