<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Precio y Descuento</title>
</head>
<body>
    <h1>Formulario de Precio y Descuento</h1>
    <form id="precioForm">
        <label for="precio">Precio del Artículo:</label>
        <input type="number" id="precio" name="precio" required><br><br>
        <label for="descuento">Porcentaje de Descuento:</label>
        <input type="number" id="descuento" name="descuento" required><br><br>
        <button type="submit">Calcular Precio Final</button>
    </form>

    <script>
        document.getElementById('precioForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const precio = parseFloat(document.getElementById('precio').value);
            const descuento = parseFloat(document.getElementById('descuento').value);

            let precioFinal;

            if (descuento > 30) {
                precioFinal = precio * (1 - descuento / 100) * (1 - 5 / 100);
            } else {
                precioFinal = precio * (1 - descuento / 100);
            }

            alert(`Precio Final: $${precioFinal.toFixed(2)}`);
        });
    </script>
</body>
</html>
